<body>
  <div id="__bundler_placeholder">Loading Ecommpay Top Talents...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1 0 313.741 0.00433612 314.109 0.0136719C337.345 0.602092 356 19.6227 356 43V133C356 156.748 336.748 176 313 176H312C286.595 176 266 196.595 266 222V223C266 246.748 246.748 266 223 266C199.252 266 180 246.748 180 223V132C180 106.595 159.405 86 134 86H133C109.252 86 90 66.7482 90 43C90 19.2518 109.252 0 133 0H313Z\" fill=\"white\"><\u002Fpath>\n<\u002Fg>\n<\u002Fsvg>\n          <div style=\"font-family: 'Sohne Breit', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1; color: #1d0030\">+3&nbsp;days<\u002Fdiv>\n          <div style=\"margin-top: 16px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.3; color: #1d0030\">More time for&nbsp;yourself<\u002Fdiv>\n          <div style=\"margin: 12px 0 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #2a0a45\"><p class=\"MsoNormal\">Three additional loyalty days added to your annual leave allowance. Take them as time off during their validity period; unused days expire after one year.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: relative; overflow: hidden; box-sizing: border-box; border-radius: 32px; isolation: isolate; padding: 36px 32px; background-color: #1F9DFF\">\n          <svg aria-hidden=\"true\" style=\"position: absolute; top: -45px; right: -45px; z-index: -1; pointer-events: none\" width=\"401.4\" height=\"239.4\" sc-camel-view-box=\"0 0 446 266\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n<g opacity=\"0.15\">\n<rect x=\"90\" width=\"86\" height=\"86\" rx=\"43\" fill=\"white\"><\u002Frect>\n<rect width=\"86\" height=\"86\" rx=\"43\" fill=\"white\"><\u002Frect>\n<rect x=\"360\" y=\"180\" width=\"86\" height=\"86\" rx=\"43\" fill=\"white\"><\u002Frect>\n<path d=\"M403 0C426.748 0 446 19.2518 446 43V133C446 156.748 426.748 176 403 176C379.252 176 360 156.748 360 133V132C360 106.595 339.405 86 314 86H223C199.252 86 180 66.7482 180 43C180 19.2518 199.252 0 223 0H403Z\" fill=\"white\"><\u002Fpath>\n<\u002Fg>\n<\u002Fsvg>\n          <div style=\"font-family: 'Sohne Breit', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1; color: #1d0030\">$2,000<\u002Fdiv>\n          <div style=\"margin-top: 16px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.3; color: #1d0030\">Development focused on your growth<\u002Fdiv>\n          <p style=\"margin: 12px 0 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #2a0a45\">A dedicated budget for coaching and learning for each Top Talent. It covers the talent year, from September to September, until the next talent calibration, and is funded by the company’s HR budget.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position: relative; overflow: hidden; box-sizing: border-box; border-radius: 32px; isolation: isolate; padding: 36px 32px; background-color: #1F9DFF\">\n          <svg aria-hidden=\"true\" style=\"position: absolute; top: -45px; right: -45px; z-index: -1; pointer-events: none\" width=\"401.4\" height=\"239.4\" sc-camel-view-box=\"0 0 446 266\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n<g opacity=\"0.1\">\n<rect x=\"270\" y=\"180\" width=\"86\" height=\"86\" rx=\"43\" fill=\"white\"><\u002Frect>\n<rect width=\"176\" height=\"86\" rx=\"43\" fill=\"white\"><\u002Frect>\n<path d=\"M403 0C403.371 0 403.741 0.00433603 404.109 0.0136719C426.976 0.592756 445.407 19.0237 445.986 41.8906C445.996 42.2593 446 42.6291 446 43V223C446 246.748 426.748 266 403 266C379.252 266 360 246.748 360 223V222C360 196.595 339.405 176 314 176H313C289.252 176 270 156.748 270 133V132C270 106.595 249.405 86 224 86H223C199.252 86 180 66.7482 180 43C180 19.2518 199.252 0 223 0H403Z\" fill=\"white\"><\u002Fpath>\n<\u002Fg>\n<\u002Fsvg>\n          <div style=\"font-family: 'Sohne Breit', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1; color: #1d0030\">10%<\u002Fdiv>\n          <div style=\"margin-top: 16px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.3; color: #1d0030\">A one-off Top Talent bonus<\u002Fdiv>\n          <p style=\"margin: 12px 0 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #2a0a45\">A single payment equal to 10% of your monthly salary. The company index is not applied to this bonus.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 64px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px\">\n        <div>\n          <h3 style=\"margin: 0; font-family: 'Sohne Breit', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15; color: #0a0a1f\">Personal development, with&nbsp;practical support<\u002Fh3>\n          <p style=\"margin: 16px 0 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">Build an&nbsp;enhanced IDP around&nbsp;your priorities. Explore learning, mentoring and&nbsp;other development options with&nbsp;your manager and&nbsp;L&amp;D.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin: 0; font-family: 'Sohne Breit', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15; color: #0a0a1f\">Your contribution, <br>made visible<\u002Fh3>\n          <p style=\"margin: 16px 0 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28; width: 443px; max-width: 100%\">Celebrate your work through&nbsp;Top Talent profiles and&nbsp;interviews, so colleagues can learn from&nbsp;your experience.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"learning-path\" style=\"position: relative; z-index: 5; margin-top: -56px; box-sizing: border-box; border-radius: 32px; background: #79f5a7; padding: 82px 64px 146px\">\n      <h2 style=\"margin: 0; max-width: 820px; font-family: 'Sohne Breit', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1; color: #0a0a1f\">Set your development goals before requesting external training<\u002Fh2>\n      <p style=\"margin: 24px 0 0; max-width: 760px; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 18px; line-height: 1.5; color: #0a0a1f\">Agree your priorities with&nbsp;your manager and&nbsp;record them in&nbsp;your IDP before&nbsp;requesting external learning.<\u002Fp>\n\n      <div class=\"lp-grid\" style=\"margin-top: 48px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--g); align-items: stretch\">\n        <div style=\"position: relative; box-sizing: border-box; border-radius: 32px; background: #f8f4f2; padding: 32px 24px; display: flex; flex-direction: column; min-width: 0\">\n          <div style=\"font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; line-height: 18px; color: #AD00FE\">1<\u002Fdiv><div class=\"lp-bridge\" aria-hidden=\"true\"><\u002Fdiv>\n          <div style=\"margin-top: 20px\"><svg aria-hidden=\"true\" width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 256 256\" style=\"display: block; overflow: visible; stroke-width: calc(2px - 1.1250px);\" fill=\"#0a0a1f\" stroke=\"#0a0a1f\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M164,104a4,4,0,0,1-4,4H96a4,4,0,0,1,0-8h64A4,4,0,0,1,164,104Zm-4,28H96a4,4,0,0,0,0,8h64a4,4,0,0,0,0-8Zm68-76V184a12,12,0,0,1-12,12H153.25L138.42,222a12,12,0,0,1-20.84,0L102.75,196H40a12,12,0,0,1-12-12V56A12,12,0,0,1,40,44H216A12,12,0,0,1,228,56Zm-8,0a4,4,0,0,0-4-4H40a4,4,0,0,0-4,4V184a4,4,0,0,0,4,4h65.07a4,4,0,0,1,3.47,2l16,28a4,4,0,0,0,6.94,0l16-28a4,4,0,0,1,3.47-2H216a4,4,0,0,0,4-4Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3 style=\"margin: 20px 0 0; font-family: 'Sohne Breit', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; color: #0a0a1f\">Discuss your development<\u002Fh3>\n          <p style=\"margin: 10px 0 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 15px; line-height: 1.5; color: #1c1c28\">Use a 1:1 with your manager to agree which skills you need and why.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position: relative; box-sizing: border-box; border-radius: 32px; background: #f8f4f2; padding: 32px 24px; display: flex; flex-direction: column; min-width: 0\">\n          <div style=\"font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; line-height: 18px; color: #AD00FE\">2<\u002Fdiv><div class=\"lp-bridge\" aria-hidden=\"true\"><\u002Fdiv>\n          <div style=\"margin-top: 20px\"><svg aria-hidden=\"true\" width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 256 256\" style=\"display: block; overflow: visible; stroke-width: calc(2px - 1.1250px);\" fill=\"#0a0a1f\" stroke=\"#0a0a1f\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M210.83,85.17l-56-56A4,4,0,0,0,152,28H56A12,12,0,0,0,44,40V216a12,12,0,0,0,12,12H200a12,12,0,0,0,12-12V88A4,4,0,0,0,210.83,85.17ZM156,41.65,198.34,84H156ZM200,220H56a4,4,0,0,1-4-4V40a4,4,0,0,1,4-4h92V88a4,4,0,0,0,4,4h52V216A4,4,0,0,1,200,220Zm-36-84a4,4,0,0,1-4,4H96a4,4,0,0,1,0-8h64A4,4,0,0,1,164,136Zm0,32a4,4,0,0,1-4,4H96a4,4,0,0,1,0-8h64A4,4,0,0,1,164,168Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3 style=\"margin: 20px 0 0; font-family: 'Sohne Breit', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; color: #0a0a1f\">Update your IDP<\u002Fh3>\n          <p style=\"margin: 10px 0 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 15px; line-height: 1.5; color: #1c1c28\">Record the skill, the reason for developing it and the expected result.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position: relative; box-sizing: border-box; border-radius: 32px; background: #f8f4f2; padding: 32px 24px; display: flex; flex-direction: column; min-width: 0\">\n          <div style=\"font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; line-height: 18px; color: #AD00FE\">3<\u002Fdiv><div class=\"lp-bridge\" aria-hidden=\"true\"><\u002Fdiv>\n          <div style=\"margin-top: 20px\"><svg aria-hidden=\"true\" width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 256 256\" style=\"display: block; overflow: visible; stroke-width: calc(2px - 1.1250px);\" fill=\"#0a0a1f\" stroke=\"#0a0a1f\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M224,52H32a4,4,0,0,0-4,4V192a12,12,0,0,0,12,12H216a12,12,0,0,0,12-12V56A4,4,0,0,0,224,52Zm-10.28,8L128,138.57,42.28,60ZM216,196H40a4,4,0,0,1-4-4V65.09L125.3,147a4,4,0,0,0,5.4,0L220,65.09V192A4,4,0,0,1,216,196Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3 style=\"margin: 20px 0 0; font-family: 'Sohne Breit', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; color: #0a0a1f\">Submit a Jira request<\u002Fh3>\n          <p style=\"margin: 10px 0 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 15px; line-height: 1.5; color: #1c1c28\">Request an internal or external learning once your development priority has been agreed with your manager and documented in your IDP.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position: relative; box-sizing: border-box; border-radius: 32px; background: #f8f4f2; padding: 32px 24px; display: flex; flex-direction: column; min-width: 0\">\n          <div style=\"font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; line-height: 18px; color: #AD00FE\">4<\u002Fdiv><div class=\"lp-bridge\" aria-hidden=\"true\"><\u002Fdiv>\n          <div style=\"margin-top: 20px\"><svg aria-hidden=\"true\" width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 256 256\" style=\"display: block; overflow: visible; stroke-width: calc(2px - 1.1250px);\" fill=\"#0a0a1f\" stroke=\"#0a0a1f\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M170.83,101.17a4,4,0,0,1,0,5.66l 18px}.faq-a>div>div{padding:0 18px 18px 18px}}\n<\u002Fstyle>\n    <section id=\"faq\" style=\"position: relative; z-index: 6; margin-top: -56px; box-sizing: border-box; border-radius: 32px; padding: 82px 64px 146px; background-color: #f8f4f2\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px\">\n\n        <div style=\"flex: 4 1 380px; min-width: 0; box-sizing: border-box; padding-top: 8px\">\n          <h2 style=\"margin: 0; font-family: 'Sohne Breit', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1; color: #0a0a1f\">Your questions answered<\u002Fh2>\n        <\u002Fdiv>\n\n        <div style=\"flex: 6 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n          <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-none\" checked=\"\">\n          <div class=\"faq-item\">\n            <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-1\">\n            <div class=\"faq-head\"><label class=\"faq-q\" for=\"faq-1\"><svg class=\"faq-arr\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"#FF5F00\" stroke=\"#FF5F00\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"overflow: visible; stroke-width: calc(2px - 0.5625px);\"><path vector-effect=\"non-scaling-stroke\" d=\"M218.83,130.83l-72,72a4,4,0,0,1-5.66-5.66L206.34,132H40a4,4,0,0,1,0-8H206.34L141.17,58.83a4,4,0,0,1,5.66-5.66l72,72A4,4,0,0,1,218.83,130.83Z\"><\u002Fpath><\u002Fsvg><span>When will I receive the 10% Top Talent bonus?<\u002Fspan><\u002Flabel><label class=\"faq-close\" for=\"faq-none\" aria-hidden=\"true\"><\u002Flabel><\u002Fdiv>\n            <div class=\"faq-a\"><div><div>\n            <p style=\"margin: 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">You’ll receive the bonus in the month following the announcement of the results. It is a one-off payment equal to 10% of your monthly salary. The company index is not applied to this bonus.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"faq-item\">\n            <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-2\">\n            <div class=\"faq-head\"><label class=\"faq-q\" for=\"faq-2\"><svg class=\"faq-arr\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"#FF5F00\" stroke=\"#FF5F00\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"overflow: visible; stroke-width: calc(2px - 0.5625px);\"><path vector-effect=\"non-scaling-stroke\" d=\"M218.83,130.83l-72,72a4,4,0,0,1-5.66-5.66L206.34,132H40a4,4,0,0,1,0-8H206.34L141.17,58.83a4,4,0,0,1,5.66-5.66l72,72A4,4,0,0,1,218.83,130.83Z\"><\u002Fpath><\u002Fsvg><span>Is the $2,000 development budget annual, and which team pays for it?<\u002Fspan><\u002Flabel><label class=\"faq-close\" for=\"faq-none\" aria-hidden=\"true\"><\u002Flabel><\u002Fdiv>\n            <div class=\"faq-a\"><div><div>\n            <p style=\"margin: 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">The $2,000 budget covers the talent year: from September to September, until the next talent calibration. It is funded by the company’s HR budget.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"faq-item\">\n            <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-3\">\n            <div class=\"faq-head\"><label class=\"faq-q\" for=\"faq-3\"><svg class=\"faq-arr\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"#FF5F00\" stroke=\"#FF5F00\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"overflow: visible; stroke-width: calc(2px - 0.5625px);\"><path vector-effect=\"non-scaling-stroke\" d=\"M218.83,130.83l-72,72a4,4,0,0,1-5.66-5.66L206.34,132H40a4,4,0,0,1,0-8H206.34L141.17,58.83a4,4,0,0,1,5.66-5.66l72,72A4,4,0,0,1,218.83,130.83Z\"><\u002Fpath><\u002Fsvg><span>Who approves my learning request, and what do I need to provide?<\u002Fspan><\u002Flabel><label class=\"faq-close\" for=\"faq-none\" aria-hidden=\"true\"><\u002Flabel><\u002Fdiv>\n            <div class=\"faq-a\"><div><div>\n            <p style=\"margin: 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">L&amp;D processes your Jira request after your manager approves it. Before submitting a request for external learning in Jira, discuss your development with your manager in a 1:1 and agree your development priorities together.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"faq-item\">\n            <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-4\">\n            <div class=\"faq-head\"><label class=\"faq-q\" for=\"faq-4\"><svg class=\"faq-arr\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"#FF5F00\" stroke=\"#FF5F00\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"overflow: visible; stroke-width: calc(2px - 0.5625px);\"><path vector-effect=\"non-scaling-stroke\" d=\"M218.83,130.83l-72,72a4,4,0,0,1-5.66-5.66L206.34,132H40a4,4,0,0,1,0-8H206.34L141.17,58.83a4,4,0,0,1,5.66-5.66l72,72A4,4,0,0,1,218.83,130.83Z\"><\u002Fpath><\u002Fsvg><span>You should be able to answer: which skills do I need now, and why?<\u002Fspan><\u002Flabel><label class=\"faq-close\" for=\"faq-none\" aria-hidden=\"true\"><\u002Flabel><\u002Fdiv>\n            <div class=\"faq-a\"><div><div>\n            <p style=\"margin: 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">For example, consider:<\u002Fp>\n            <ul style=\"margin: 12px 0 0; padding: 0; list-style: none\">\n              <li style=\"position: relative; padding-left: 18px; font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.5; color: #1c1c28\"><span style=\"position: absolute; left: 0; color: #AD00FE\">•<\u002Fspan>Which skills do I need to maintain or strengthen to keep achieving my current goals?<\u002Fli>\n              <li style=\"position: relative; padding-left: 18px; font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.5; color: #1c1c28\"><span style=\"position: absolute; left: 0; color: #AD00FE\">•<\u002Fspan>Which new skills will help me work more effectively?<\u002Fli>\n              <li style=\"position: relative; padding-left: 18px; font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.5; color: #1c1c28\"><span style=\"position: absolute; left: 0; color: #AD00FE\">•<\u002Fspan>Which skills will help me take a process or project to the next level?<\u002Fli>\n              <li style=\"position: relative; padding-left: 18px; font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.5; color: #1c1c28\"><span style=\"position: absolute; left: 0; color: #AD00FE\">•<\u002Fspan>Which knowledge will help me take on new tasks or greater responsibility?<\u002Fli>\n            <\u002Ful>\n            <p style=\"margin: 16px 0 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">Record these agreements in your individual development plan (IDP), making clear which skill you are developing, why you need it and what result you expect.<\u002Fp>\n            <p style=\"margin: 16px 0 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">Development should make sense for both you and the company. When choosing learning, explain how the knowledge will help you achieve your goals, increase your impact and benefit your team and the business.<\u002Fp>\n            <p style=\"margin: 16px 0 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">Once your development priority is agreed and recorded in your IDP, you can submit your request for external learning in Jira.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"faq-item\">\n            <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-5\">\n            <div class=\"faq-head\"><label class=\"faq-q\" for=\"faq-5\"><svg class=\"faq-arr\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"#FF5F00\" stroke=\"#FF5F00\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"overflow: visible; stroke-width: calc(2px - 0.5625px);\"><path vector-effect=\"non-scaling-stroke\" d=\"M218.83,130.83l-72,72a4,4,0,0,1-5.66-5.66L206.34,132H40a4,4,0,0,1,0-8H206.34L141.17,58.83a4,4,0,0,1,5.66-5.66l72,72A4,4,0,0,1,218.83,130.83Z\"><\u002Fpath><\u002Fsvg><span>How was I selected?<\u002Fspan><\u002Flabel><label class=\"faq-close\" for=\"faq-none\" aria-hidden=\"true\"><\u002Flabel><\u002Fdiv>\n            <div class=\"faq-a\"><div><div>\n            <p style=\"margin: 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">Based on objective criteria: performance, 360° feedback and executive calibration.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"faq-item\">\n            <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-6\">\n            <div class=\"faq-head\"><label class=\"faq-q\" for=\"faq-6\"><svg class=\"faq-arr\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"#FF5F00\" stroke=\"#FF5F00\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"overflow: visible; stroke-width: calc(2px - 0.5625px);\"><path vector-effect=\"non-scaling-stroke\" d=\"M218.83,130.83l-72,72a4,4,0,0,1-5.66-5.66L206.34,132H40a4,4,0,0,1,0-8H206.34L141.17,58.83a4,4,0,0,1,5.66-5.66l72,72A4,4,0,0,1,218.83,130.83Z\"><\u002Fpath><\u002Fsvg><span>How long do I stay in the program?<\u002Fspan><\u002Flabel><label class=\"faq-close\" for=\"faq-none\" aria-hidden=\"true\"><\u002Flabel><\u002Fdiv>\n            <div class=\"faq-a\"><div><div>\n            <p style=\"margin: 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">Typically 1 year, with annual review.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"faq-item\">\n            <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-7\">\n            <div class=\"faq-head\"><label class=\"faq-q\" for=\"faq-7\"><svg class=\"faq-arr\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"#FF5F00\" stroke=\"#FF5F00\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"overflow: visible; stroke-width: calc(2px - 0.5625px);\"><path vector-effect=\"non-scaling-stroke\" d=\"M218.83,130.83l-72,72a4,4,0,0,1-5.66-5.66L206.34,132H40a4,4,0,0,1,0-8H206.34L141.17,58.83a4,4,0,0,1,5.66-5.66l72,72A4,4,0,0,1,218.83,130.83Z\"><\u002Fpath><\u002Fsvg><span>Can I lose Top Talent status?<\u002Fspan><\u002Flabel><label class=\"faq-close\" for=\"faq-none\" aria-hidden=\"true\"><\u002Flabel><\u002Fdiv>\n            <div class=\"faq-a\"><div><div>\n            <p style=\"margin: 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">Your Top Talent status is reviewed during the annual calibration and may change based on the results if your performance or behaviour no longer meets the programme criteria. Your status remains unchanged throughout the year, except in cases of serious violations of company policies.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"faq-item\">\n            <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-8\">\n            <div class=\"faq-head\"><label class=\"faq-q\" for=\"faq-8\"><svg class=\"faq-arr\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"#FF5F00\" stroke=\"#FF5F00\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"overflow: visible; stroke-width: calc(2px - 0.5625px);\"><path vector-effect=\"non-scaling-stroke\" d=\"M218.83,130.83l-72,72a4,4,0,0,1-5.66-5.66L206.34,132H40a4,4,0,0,1,0-8H206.34L141.17,58.83a4,4,0,0,1,5.66-5.66l72,72A4,4,0,0,1,218.83,130.83Z\"><\u002Fpath><\u002Fsvg><span>Who decides on promotions?<\u002Fspan><\u002Flabel><label class=\"faq-close\" for=\"faq-none\" aria-hidden=\"true\"><\u002Flabel><\u002Fdiv>\n            <div class=\"faq-a\"><div><div>\n            <p style=\"margin: 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">Your Top Talent status gives you priority consideration for promotion opportunities, but it does not guarantee a promotion. Promotion decisions are made separately, based on business needs and established criteria.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"faq-item\">\n            <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-9\">\n            <div class=\"faq-head\"><label class=\"faq-q\" for=\"faq-9\"><svg class=\"faq-arr\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"#FF5F00\" stroke=\"#FF5F00\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"overflow: visible; stroke-width: calc(2px - 0.5625px);\"><path vector-effect=\"non-scaling-stroke\" d=\"M218.83,130.83l-72,72a4,4,0,0,1-5.66-5.66L206.34,132H40a4,4,0,0,1,0-8H206.34L141.17,58.83a4,4,0,0,1,5.66-5.66l72,72A4,4,0,0,1,218.83,130.83Z\"><\u002Fpath><\u002Fsvg><span>What benefits are guaranteed vs discretionary?<\u002Fspan><\u002Flabel><label class=\"faq-close\" for=\"faq-none\" aria-hidden=\"true\"><\u002Flabel><\u002Fdiv>\n            <div class=\"faq-a\"><div><div>\n            <p style=\"margin: 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">Development opportunities are guaranteed. Rewards like bonus and recognition are discretionary.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"faq-item\">\n            <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-10\">\n            <div class=\"faq-head\"><label class=\"faq-q\" for=\"faq-10\"><svg class=\"faq-arr\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"#FF5F00\" stroke=\"#FF5F00\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"overflow: visible; stroke-width: calc(2px - 0.5625px);\"><path vector-effect=\"non-scaling-stroke\" d=\"M218.83,130.83l-72,72a4,4,0,0,1-5.66-5.66L206.34,132H40a4,4,0,0,1,0-8H206.34L141.17,58.83a4,4,0,0,1,5.66-5.66l72,72A4,4,0,0,1,218.83,130.83Z\"><\u002Fpath><\u002Fsvg><span>How do I apply for mobility opportunities?<\u002Fspan><\u002Flabel><label class=\"faq-close\" for=\"faq-none\" aria-hidden=\"true\"><\u002Flabel><\u002Fdiv>\n            <div class=\"faq-a\"><div><div>\n            <p style=\"margin: 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">Apply via the internal mobility platform or through recommendations.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"faq-item\">\n            <input class=\"faq-in\" type=\"radio\" name=\"faq\" id=\"faq-11\">\n            <div class=\"faq-head\"><label class=\"faq-q\" for=\"faq-11\"><svg class=\"faq-arr\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 256 256\" fill=\"#FF5F00\" stroke=\"#FF5F00\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"overflow: visible; stroke-width: calc(2px - 0.5625px);\"><path vector-effect=\"non-scaling-stroke\" d=\"M218.83,130.83l-72,72a4,4,0,0,1-5.66-5.66L206.34,132H40a4,4,0,0,1,0-8H206.34L141.17,58.83a4,4,0,0,1,5.66-5.66l72,72A4,4,0,0,1,218.83,130.83Z\"><\u002Fpath><\u002Fsvg><span>What is expected from me as a Top Talent?<\u002Fspan><\u002Flabel><label class=\"faq-close\" for=\"faq-none\" aria-hidden=\"true\"><\u002Flabel><\u002Fdiv>\n            <div class=\"faq-a\"><div><div>\n            <p style=\"margin: 0; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; line-height: 1.5; color: #1c1c28\">High performance, active development, engagement in opportunities and role modelling our values.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"next-step\" style=\"position: relative; z-index: 7; margin-top: -56px; box-sizing: border-box; border-radius: 32px; padding: 82px 64px 146px; background-color: #1F9CFF\">\n      <h2 style=\"margin: 0; max-width: 820px; font-family: 'Sohne Breit', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1; color: #0a0a1f\">Choose your next step.<\u002Fh2>\n      <p style=\"margin: 24px 0 0; max-width: 760px; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 18px; line-height: 1.5; color: #0a0a1f\">Start with&nbsp;your development goal, then choose the&nbsp;support that will help you reach it. If you are unsure where to&nbsp;begin, speak to&nbsp;L&amp;D.<\u002Fp>\n\n      <div style=\"margin-top: 48px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch\">\n        <div style=\"box-sizing: border-box; border-radius: 32px; background: #f8f4f2; padding: 36px 32px; display: flex; flex-direction: column\">\n          <svg aria-hidden=\"true\" width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 256 256\" style=\"display: block; overflow: visible; stroke-width: calc(2px - 1.3750px);\" fill=\"#0a0a1f\" stroke=\"#0a0a1f\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M164,152a4,4,0,0,1-4,4H96a4,4,0,0,1,0-8h64A4,4,0,0,1,164,152Zm-4-36H96a4,4,0,0,0,0,8h64a4,4,0,0,0,0-8Zm52-68V216a12,12,0,0,1-12,12H56a12,12,0,0,1-12-12V48A12,12,0,0,1,56,36H94.08a44,44,0,0,1,67.84,0H200A12,12,0,0,1,212,48ZM92,64v4h72V64a36,36,0,0,0-72,0ZM204,48a4,4,0,0,0-4-4H167.17A43.71,43.71,0,0,1,172,64v8a4,4,0,0,1-4,4H88a4,4,0,0,1-4-4V64a43.71,43.71,0,0,1,4.83-20H56a4,4,0,0,0-4,4V
